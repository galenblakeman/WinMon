name: Test

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.variant }} ${{ matrix.scope }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [desktop, store]
        scope: [Unit, Integration]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build and test
        run: |
          if ('${{ matrix.variant }}' -eq 'store') {
            ./tools/Verify.ps1 -Store -TestScope '${{ matrix.scope }}'
          }
          else {
            ./tools/Verify.ps1 -TestScope '${{ matrix.scope }}'
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.variant }}-${{ matrix.scope }}-${{ github.run_id }}
          path: artifacts/verify/*/tests/*.trx
          if-no-files-found: warn
