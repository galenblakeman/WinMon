name: Package release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Install pinned Inno Setup compiler
        run: ./tools/Install-InnoSetup.ps1
      - name: Test and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          UPDATE_SIGNING_KEY_BASE64: ${{ secrets.WINMON_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          $parameters = @{ OutputDirectory = "$PWD/artifacts/release" }
          if ($env:REF_TYPE -eq 'tag') { $parameters.ExpectedTag = $env:RELEASE_TAG }
          $keyPath = Join-Path $env:RUNNER_TEMP 'winmon-update-signing-key.pem'
          try {
            if ($env:UPDATE_SIGNING_KEY_BASE64) {
              [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:UPDATE_SIGNING_KEY_BASE64))
              $parameters.UpdateSigningKeyPath = $keyPath
            }
            elseif ($env:REF_TYPE -eq 'tag') {
              throw 'Tagged releases require the WINMON_UPDATE_SIGNING_KEY_BASE64 secret so they are eligible for in-app updates.'
            }
            ./tools/New-Release.ps1 @parameters
          }
          finally {
            if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue }
          }
      - name: Validate installer lifecycle and application startup
        run: |
          $installer = Get-ChildItem artifacts/release/*-Setup-x64.exe
          ./tools/Test-Installer.ps1 -InstallerPath $installer.FullName
      - name: Validate WinGet manifests
        run: |
          Install-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 -Scope CurrentUser -Repository PSGallery -Force
          Import-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380
          Repair-WinGetPackageManager -Version 1.29.380
          $archive = Get-ChildItem artifacts/release/*-winget.zip
          Expand-Archive $archive.FullName artifacts/winget
          $manifest = Get-ChildItem artifacts/winget -Filter '*.installer.yaml' -Recurse
          winget validate --manifest $manifest.DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed.' }
      - name: Upload release assets and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winmon-release
          path: |
            artifacts/release/*
            artifacts/packaging/**/test-results/*
            artifacts/installer-validation/**/*.log
            artifacts/installer-validation/**/smoke/*
          if-no-files-found: error
      - name: Create draft GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "WinMon $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
