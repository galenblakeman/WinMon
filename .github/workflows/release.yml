name: Package release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    environment: release
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          # ArtifactSigning 0.1.20 also requires the .NET 8 runtime.
          dotnet-version: '8.0.x'
      - name: Install pinned Inno Setup compiler
        run: ./tools/Install-InnoSetup.ps1
      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned Artifact Signing module
        run: Install-Module ArtifactSigning -RequiredVersion 0.1.20 -Repository PSGallery -Scope CurrentUser -Force
      - name: Test and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          UPDATE_SIGNING_KEY_BASE64: ${{ secrets.WINMON_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          $parameters = @{ OutputDirectory = "$PWD/artifacts/release"; CodeSign = $true }
          if ($env:REF_TYPE -eq 'tag') { $parameters.ExpectedTag = $env:RELEASE_TAG }
          $keyPath = Join-Path $env:RUNNER_TEMP 'winmon-update-signing-key.pem'
          try {
            if ($env:UPDATE_SIGNING_KEY_BASE64) {
              [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:UPDATE_SIGNING_KEY_BASE64))
              $parameters.UpdateSigningKeyPath = $keyPath
            }
            else {
              throw 'Release packaging requires the WINMON_UPDATE_SIGNING_KEY_BASE64 secret so artifacts are eligible for in-app updates.'
            }
            ./tools/New-Release.ps1 @parameters
          }
          finally {
            if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue }
          }
      - name: Preserve signed release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winmon-signed-release
          path: artifacts/release/*
          if-no-files-found: error
      - name: Validate desktop installer lifecycle and application startup
        timeout-minutes: 6
        run: ./tools/Test-Installer.ps1 -InstallerPath (Get-Item artifacts/release/WinMon-*-Setup-x64.exe | Where-Object Name -notmatch 'Cli|Mcp').FullName
      - name: Validate CLI installer lifecycle
        timeout-minutes: 6
        run: ./tools/Test-CliInstaller.ps1 -InstallerPath (Get-Item artifacts/release/WinMon-Cli-*-Setup-x64.exe).FullName
      - name: Validate MCP installer lifecycle
        timeout-minutes: 6
        run: ./tools/Test-McpInstaller.ps1 -InstallerPath (Get-Item artifacts/release/WinMon-Mcp-*-Setup-x64.exe).FullName
      - name: Validate installer migration
        timeout-minutes: 6
        run: |
          $migrationPayload = Join-Path $env:RUNNER_TEMP 'winmon-migration-payload'
          Expand-Archive -LiteralPath (Get-Item artifacts/release/WinMon-[0-9]*-win-x64.zip).FullName -DestinationPath $migrationPayload
          ./tools/Test-InstallerMigration.ps1 -PublishDirectory $migrationPayload
      - name: Validate WinGet manifests
        run: |
          Install-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 -Scope CurrentUser -Repository PSGallery -Force
          Import-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380
          Repair-WinGetPackageManager -Version 1.29.380
          $archive = Get-ChildItem artifacts/release/*-winget.zip
          Expand-Archive $archive.FullName artifacts/winget
          $manifest = Get-ChildItem artifacts/winget -Filter '*.installer.yaml' -Recurse
          winget validate --manifest $manifest.DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed.' }
      - name: Upload release assets and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winmon-release
          path: |
            artifacts/release/*
            artifacts/packaging/**/test-results/*
            artifacts/packaging/**/*-signature.json
            artifacts/installer-validation/**/*.log
            artifacts/installer-validation/**/smoke/*
            artifacts/installer-migration/**/*.log
          if-no-files-found: error
      - name: Create draft GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "WinMon $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
